[project]
name = "sql-agent"
version = "0.1.0"
description = "Self-correcting text-to-SQL agent, measured on BIRD mini-dev"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ask = "sqlagent.cli:main"
sqlagent-web = "sqlagent.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlagent"]
artifacts = ["sqlagent/web/index.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
