[project]
name = "sql-agent"
version = "0.1.0"
description = "Self-correcting text-to-SQL agent, measured on BIRD mini-dev"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24.0",
]

[project.scripts]
ask = "sqlagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlagent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
